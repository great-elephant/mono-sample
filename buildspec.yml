version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin 886473596958.dkr.ecr.us-west-2.amazonaws.com
      - REPOSITORY_URI=886473596958.dkr.ecr.us-west-2.amazonaws.com/simple-docker-service-02f0541bd1f7
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - npm i -g turbo@2.4.4
  build:
    commands:
      - echo "🚀 Finding affected apps with Turborepo..."
      - AFFECTED_APPS=$(turbo run build --filter=...[HEAD^] --dry-run=json | jq -r '.packages | join(" ")')

      # Check if any apps are affected
      - if [ -z "$AFFECTED_APPS" ]; then
          echo "✅ No affected apps to build. Skipping Docker builds.";
        else
          echo "🛠️ Affected apps detected:";
          for app in $AFFECTED_APPS; do
            echo "- $app";
          done
        fi
        
      # - echo Build started on ⁠ date ⁠
      # - echo Building the Docker image...
      # - docker build -t $REPOSITORY_URI:latest .
      # - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  # post_build:
  #   commands:
  #     - echo Build completed on ⁠ date ⁠
  #     - echo Pushing the Docker images...
  #     - docker push $REPOSITORY_URI:latest
  #     - docker push $REPOSITORY_URI:$IMAGE_TAG
  #     - echo Writing image definitions file...
  #     - printf '[{"name":"simple-express-container","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
artifacts:
    files: imagedefinitions.json